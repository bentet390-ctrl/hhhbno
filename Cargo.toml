[package]
name = "rpow2-miner"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "rpow2-miner"
path = "src/main.rs"

[dependencies]
sha2      = "0.10"
reqwest   = { version = "0.12", features = ["json"] }
serde     = { version = "1", features = ["derive"] }
serde_json= "1"
tokio     = { version = "1", features = ["full"] }
futures   = "0.3"
num_cpus  = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
